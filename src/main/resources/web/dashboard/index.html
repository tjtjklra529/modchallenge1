<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RecallTotem Regions Map</title>
  <link rel="stylesheet" href="leaflet/leaflet.css" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    #map { height: 70vh; }
    #controls { padding: 12px; }
    .region-list { max-height: 25vh; overflow:auto; padding:8px; }
  </style>
</head>
<body>
  <div id="controls">
    <input id="token" placeholder="token" style="width:300px" />
    <button id="load">Load Regions</button>
    <div id="info" style="display:inline-block; margin-left:12px;"></div>
    <button id="loadAudit">Load Audit (token required)</button>
  </div>
  <div id="map"></div>
  <div class="region-list" id="list"></div>
  <div style="margin-top:8px;">
    <div id="audit" style="white-space:pre-wrap; max-height:200px; overflow:auto; border:1px solid #eee; padding:8px; margin-top:6px;"></div>
  </div>

  <script src="leaflet/leaflet.js"></script>
  <script src="regions.js"></script>
  <script src="deliveries.js"></script>

  <script>
    document.getElementById('loadAudit').addEventListener('click', () => {
      const token = document.getElementById('token').value.trim();
      if (!token) { alert('Please enter token'); return; }
      fetch('/recalltotem/audit?token=' + encodeURIComponent(token))
        .then(r => { if (!r.ok) throw new Error('Failed to fetch audit: ' + r.status); return r.text(); })
        .then(txt => { document.getElementById('audit').textContent = txt; })
        .catch(err => alert(err.message));
    });
  </script>
</body>
</html>
